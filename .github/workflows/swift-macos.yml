name: Build macOS

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches-ignore:
      - 'gh-pages'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          # contains Swift 6.2.4 (last bump was due to concurrency compilation
          # errors in NaiveQueueExecutor)
          xcode-version: '26.3' 

      - name: Swift version
        run: swift --version

      - name: Checkout
        uses: actions/checkout@v4

      - name: Test
        run: swift test

      - name: Build for arm64
        run: SBUN_NO_SCHEMA_GEN=1 swift build --enable-experimental-prebuilts --arch arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swift-bundler-arm64
          path: .build/debug/swift-bundler
