name: Update Docs

on:
  push:
    branches:
      - 'main'
  pull_request:
    branches-ignore:
      - 'gh-pages'
  workflow_dispatch:

jobs:
  update-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Swift version
        run: swift --version

      - uses: actions/checkout@v4

      # Our custom DocC renderer supports TOML syntax highlighting
      - name: Check out custom DocC renderer
        run: git clone https://github.com/stackotter/swift-docc-render-artifact ../swift-docc-render-artifact

      - name: Render docs
        run: |
          set -eux

          # Render documentation
          export DOCC_JSON_PRETTYPRINT="YES"
          export SWIFTPM_ENABLE_COMMAND_PLUGINS=1 
          export DOCC_HTML_DIR=../swift-docc-render-artifact/dist
          swift package \
            --disable-experimental-prebuilts \
            --allow-writing-to-directory gh-pages/docs \
            generate-documentation \
            --target swift-bundler \
            --disable-indexing \
            --transform-for-static-hosting \
            --output-path DocsBuild

      - name: Apply modifications
        run: |
          set -eux

          cd DocsBuild

          # Inject a / redirect and a favicon
          cp ../Pages/index.html .
          cp ../Pages/favicon.ico .

          # Patch target name from swift_bundler to swift-bundler
          mv documentation/swift_bundler/index.html \
            documentation/swift-bundler
          rm -rf documentation/swift_bundler

          mv data/documentation/swift_bundler.json \
            data/documentation/swift-bundler.json

          # On macOS, replace `-i` with `-i '' -e`
          LC_ALL=C find . -type f -exec sed -i 's/swift_bundler/swift-bundler/g' {} \;
          
      - name: Upload GitHub Pages artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: DocsBuild/
