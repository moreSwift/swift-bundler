name: Distribution artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

# This workflow uses pinned commit hashes for external actions to avoid supply
# chain attacks because this workflow handles particularly sensitive data
# such as macOS signing secrets.
jobs:
  macos:
    name: macOS (.pkg)
    runs-on: macos-15
    timeout-minutes: 60
    # Signing credentials should live in this environment rather than in
    # repository secrets, with "Required reviewers" and a deployment branch
    # rule limiting it to main (see Distribution/README.md#credential-storage).
    environment: distribution
    steps:
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: '26.3'

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Swift version
        run: swift --version

      - name: Import Developer ID certificates
        env:
          MACOS_CERTIFICATES_P12: ${{ secrets.MACOS_CERTIFICATES_P12 }}
          MACOS_CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_CERTIFICATES_P12:-}" ]; then
            echo "MACOS_CERTIFICATES_P12 is not set; building an unsigned .pkg."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATES="$RUNNER_TEMP/certificates.p12"

          echo "$MACOS_CERTIFICATES_P12" | base64 --decode > "$CERTIFICATES"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATES" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATES_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productsign -T /usr/bin/security
          # Without the partition list codesign cannot use the private keys
          # non-interactively.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"
          rm -f "$CERTIFICATES"

          security find-identity -v "$KEYCHAIN"

      - name: Store notarization credentials
        env:
          MACOS_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
          MACOS_ASC_KEY_P8: ${{ secrets.MACOS_ASC_KEY_P8 }}
          MACOS_ASC_KEY_ID: ${{ vars.MACOS_ASC_KEY_ID }}
          MACOS_ASC_ISSUER_ID: ${{ vars.MACOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail

          if [ -z "${MACOS_NOTARY_PROFILE:-}" ]; then
            echo "MACOS_NOTARY_PROFILE is not set; skipping notarization setup."
            exit 0
          fi

          if [ -z "${MACOS_ASC_KEY_P8:-}" ]; then
            echo "::error::MACOS_NOTARY_PROFILE is set, but MACOS_ASC_KEY_P8 is not provided."
            exit 1
          fi

          KEY="$RUNNER_TEMP/AuthKey.p8"
          echo "$MACOS_ASC_KEY_P8" | base64 --decode > "$KEY"
          arguments=(--key "$KEY" --key-id "$MACOS_ASC_KEY_ID")
          if [ -n "${MACOS_ASC_ISSUER_ID:-}" ]; then
            arguments+=(--issuer "$MACOS_ASC_ISSUER_ID")
          fi
          xcrun notarytool store-credentials \
            "$MACOS_NOTARY_PROFILE" "${arguments[@]}"
          rm -f "$KEY"

      - name: Build universal binary and .pkg
        env:
          SBUN_APP_IDENTITY: ${{ vars.MACOS_APP_IDENTITY }}
          SBUN_INSTALLER_IDENTITY: ${{ vars.MACOS_INSTALLER_IDENTITY }}
          SBUN_NOTARY_PROFILE: ${{ vars.MACOS_NOTARY_PROFILE }}
        run: |
          python3 Distribution/macos/build.py

      - name: Upload .pkg
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-bundler-macos
          if-no-files-found: error
          path: |
            Distribution/out/macos/*.pkg
            Distribution/out/macos/*.pkg.sha256

  linux:
    name: Linux (.deb, .rpm, .tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm

      - name: Swift version
        run: |
          swift --version
          python3 --version

      - name: Build .deb, .rpm and .tar.gz
        run: |
          python3 Distribution/linux/build.py all

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-bundler-linux
          if-no-files-found: error
          path: |
            Distribution/out/linux/*.deb
            Distribution/out/linux/*.rpm
            Distribution/out/linux/*.tar.gz

  windows:
    name: Windows (.msi, .zip)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        # bash is not available in the Swift for Windows setup action's
        # environment, so use PowerShell like the other Windows workflow.
        shell: pwsh
    steps:
      - name: Setup VS Dev Environment
        uses: seanmiddleditch/gha-setup-vsdevenv@cf96bf5b227cac6af28c04c4a4e69286ea444163 # v5

      - name: Setup Swift
        uses: compnerd/gha-setup-swift@5344b9655c9ca3242ac8b5bd769d018179b4056a # v0.2.3
        with:
          branch: swift-6.3-release
          tag: 6.3-RELEASE

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Software versions
        run: |
          swift --version
          python --version

      - name: Build .msi and .zip
        run: |
          python Distribution/windows/build.py all

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-bundler-windows
          if-no-files-found: error
          path: |
            Distribution/out/windows/*.msi
            Distribution/out/windows/*.zip
